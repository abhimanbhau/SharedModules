project.ext {
    // ExoPlayer (Android Codec APIs) requires API 16+
    // Leanback requires API 17+
    // j2v8 6.2.1 requires API 18+
    // Compose for TV (androidx.tv:tv-material/tv-foundation) requires API 21+
    // AetherTube raises the floor to 23 (Android 6.0): upstream SmartTube's very low floor forces
    // several deps to stay on ancient versions purely for Android 4.x/5.x support. API 23+ covers
    // effectively all Android TV hardware still in use (cheap boxes ship 7.1/9/11) at the cost of
    // dropping Android TV 5.x and Fire OS 5 (Fire TV Stick 1st/2nd gen).
    minSdkVersion = 23
    // Fix AppSettingsActivity crash: "Only fullscreen opaque activities can request orientation".
    // Error happen only on Android 8.0 (api 26) when you set activity orientation in manifest.
    // Possible fix is to set targetSdkVersion to 26.
    // More info: https://stackoverflow.com/questions/48072438/java-lang-illegalstateexception-only-fullscreen-opaque-activities-can-request-o
    // NOTE: target sdk >= 28 cause weird behavior on Android 9 (slow text scroll speed etc)
    // NOTE: target sdk >= 30 needed to support manifest queries tag
    // NOTE: api 26 orientation error fix: https://stackoverflow.com/a/52426009/1279056
    // NOTE: set api to 26 to fix text scroll speed and crashes on samsung
    // NOTE: api 26 triggers PlayProtect warning (dangerous)
    //targetSdkVersion = 26 // set target api = 26 to fix Android 8.0 error: "Only fullscreen opaque activities can request orientation"
    // NOTE: targetSdk 26 eleminates those bugs:
    // - "Code loading..." bug when trying to pair with a phone
    // - Card's title scrolling speed
    // - No popup notifications
    // - Backup/restore can access to the external directory
    // - Disabled auto start of the background service (e.g. remote control service)
    targetSdkVersion = 27 // 29 latest with lecacy storage access, 27 - latest with mouse dpad emulaton
    compileSdkVersion = 36
    //gradleVersion = '6.9.1' // https://developer.android.com/studio/releases/gradle-plugin#updating-gradle
    //androidGradleVersion = '4.0.0+' // last version compatible with IntellJ 2020.3
    
    testSupportVersion = '0.5'
    testXSupportVersion = '1.1.0'
    kotlinVersion = '2.0.21' // Compose compiler ships with Kotlin from 2.0 (compose-compiler-gradle-plugin)
    kotlinxVersion = '1.8.1' // coroutines matching Kotlin 2.0
    // Compose for TV (smarttubetv module only)
    composeVersion = '1.10.3' // matches what androidx.tv 1.0.0 depends on; compiler now comes from Kotlin
    tvComposeVersion = '1.0.0' // stable; drops the TvLazy* fork (modern Compose handles TV focus natively)
    activityComposeVersion = '1.9.3'
    // material-icons-core/extended stopped tracking the Compose version (frozen at 1.7.x upstream)
    composeMaterialIconsVersion = '1.7.8'
    // NOTE: Kotlin core 1.7.0 has 'resource android:attr/lStar not found' error (dialog black background bug)
    kotlinCoreXVersion = '1.15.0' // core-ktx; needs to carry OnUserLeaveHintProvider for activity/fragment 1.9+
    coreXVersion = '1.15.0'
    appCompatXVersion = '1.6.1' // 1.7.0+ is built with Kotlin 1.9 (metadata our 1.8.10 compiler rejects)
    leanbackXVersion = '1.0.0'
    viewpagerXVersion = '1.0.0'
    activityXVersion = '1.9.3'
    loaderXVersion = '1.0.0'
    interpolatorXVersion = '1.0.0'
    cardviewXVersion = '1.0.0'
    legacySupportV4XVersion = '1.0.0'
    annotationXVersion = '1.7.1'
    recyclerviewXVersion = '1.3.2'
    preferenceXVersion = '1.1.0' // Note: 1.2.0 Requires multiple androidx.lifecycle libs
    mediaXVersion = '1.2.0' // exoplayer fix
    constraintLayoutXVersion = '1.1.2'
    supportVersion = '28.0.0'
    dexmakerVersion = '1.2'
    mockitoVersion = '1.9.5'
    junitVersion = '4.12'
    retromockVersion = '1.1.1'
    hamcrestVersion = '1.3'
    powermockVersion = '1.6.2'
    truthVersion = '0.39'
    robolectricVersion = '4.6.1'
    autoValueVersion = '1.6'
    checkerframeworkVersion = '2.5.0'
    testRunnerVersion = '1.0.2'
    // materialVersion = '1.2.1'
    materialVersion = '1.9.0' // 1.10+ is built with Kotlin 1.9 (metadata our 1.8.10 compiler rejects)
    flexboxVersion = '3.0.0'
    
    legacyExoplayerVersion = '2.9.6'
    // exoplayerVersion = '2.10.8' // Old
    exoplayerVersion = '2.12.3'
    // amazonExoplayerVersion = '2.10.6' // Old
    // amazonExoplayerVersion = '2.13.3' // New
    amazonExoplayerVersion = '2.10.6'
    amazonExoplayerJitpackVersion = 'amazon~r2.12.1-SNAPSHOT'
    // playServicesCronetVersion = '18.0.1'
    // cronetApiVersion = '119.6045.31' // for testing
    cronetApiVersion = '105.5195.68' // latest version with Android 7.0 support
    // cronetApiVersion = '98.4758.101' // fast too
    // cronetApiVersion = '75.3770.101' // the fastest one (best choice)
    cronetOkHttpVersion = '0.1.0'
    
    espressoVersion = '3.2.0'
